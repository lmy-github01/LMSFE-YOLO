# Dataset configuration overrides the default class count.
nc: 10
scale: s
scales:
  n: [0.5, 0.25, 1024]
  s: [0.5, 0.5, 1024]
  m: [0.5, 1.0, 512]
  l: [1.0, 1.0, 512]
  x: [1.0, 1.5, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0
  - [-1, 1, Conv, [128, 3, 2]] # 1
  - [-1, 2, C3k2_MSEE, [256, false, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3
  - [-1, 2, C3k2_MSEE, [512, false, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5
  - [-1, 2, C3k2_MSEE, [512, true]] # 6
  - [-1, 1, SPPF, [512, 5]] # 7

head:
  - [-1, 1, SNI, [2]] # 8
  - [2, 1, Downsample, [256]] # 9
  - [[-1, -2, 4], 1, DMF, [512]] # 10
  - [[-1, 6], 1, HST, [512, 2, 0.5]] # 11
  - [-1, 1, SNI, [2]] # 12
  - [[-1, 2], 1, DMF, [256]] # 13
  - [-1, 2, C3k2, [128, false]] # 14
  - [-1, 1, GSConv, [256, 3, 2]] # 15
  - [[4, 11], 1, LCSM, [256, true]] # 16
  - [[-1, -2, 10], 1, DMF, [128]] # 17
  - [-1, 2, C3k2, [256, false]] # 18
  - [-1, 1, GSConv, [512, 3, 2]] # 19
  - [[-1, 7], 1, DMF, [256]] # 20
  - [-1, 2, C3k2, [512, false]] # 21
  - [[14, 18, 21], 1, Detect, [nc]] # 22
