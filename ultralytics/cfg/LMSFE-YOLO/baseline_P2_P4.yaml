# Dataset configuration overrides the default class count.
nc: 10
scale: s
scales:
  n: [0.5, 0.25, 1024]
  s: [0.5, 0.5, 1024]
  m: [0.5, 1.0, 512]
  l: [1.0, 1.0, 512]
  x: [1.0, 1.5, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0
  - [-1, 1, Conv, [128, 3, 2]] # 1
  - [-1, 2, C3k2, [256, false, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3
  - [-1, 2, C3k2, [512, false, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5
  - [-1, 2, C3k2, [512, true]] # 6
  - [-1, 1, SPPF, [512, 5]] # 7

head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]] # 8
  - [[-1, 4], 1, Concat, [1]] # 9
  - [-1, 2, C3k2, [512, false]] # 10
  - [-1, 1, nn.Upsample, [None, 2, nearest]] # 11
  - [[-1, 2], 1, Concat, [1]] # 12
  - [-1, 2, C3k2, [128, false]] # 13
  - [-1, 1, Conv, [256, 3, 2]] # 14
  - [[-1, 10], 1, Concat, [1]] # 15
  - [-1, 2, C3k2, [256, false]] # 16
  - [-1, 1, Conv, [512, 3, 2]] # 17
  - [[-1, 7], 1, Concat, [1]] # 18
  - [-1, 2, C3k2, [512, false]] # 19
  - [[13, 16, 19], 1, Detect, [nc]] # 20
